  <line x1="1010" y1="630" x2="1010" y2="772" stroke="#D9A81C" stroke-width="1.8"/>
  <polygon points="990,772 1030,772 1010,802" fill="#D9A81C" stroke="#D9A81C" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="988" y1="802" x2="1032" y2="802" stroke="#D9A81C" stroke-width="2.6"/>
  <line x1="1010" y1="802" x2="1010" y2="845" stroke="#D9A81C" stroke-width="1.8"/>
  <text x="1036" y="700" font-size="14" font-weight="700" fill="#B8900F">жовтий</text>
  <text x="1036" y="718" font-size="12.5" fill="#6B7C83">готова</text>

  <line x1="1120" y1="630" x2="1120" y2="772" stroke="#2FA360" stroke-width="1.8"/>
  <polygon points="1100,772 1140,772 1120,802" fill="#2FA360" stroke="#2FA360" stroke-width="1.6" stroke-linejoin="round"/>
  <line x1="1098" y1="802" x2="1142" y2="802" stroke="#2FA360" stroke-width="2.6"/>
  <line x1="1120" y1="802" x2="1120" y2="845" stroke="#2FA360" stroke-width="1.8"/>
  <text x="1146" y="700" font-size="14" font-weight="700" fill="#2FA360">зелений</text>
  <text x="1146" y="718" font-size="12.5" fill="#6B7C83">працює</text>

  <line x1="900" y1="845" x2="1120" y2="845" stroke="#14191B" stroke-width="2"/>
  <circle cx="1010" cy="845" r="4" fill="#14191B"/>
  <circle cx="1120" cy="845" r="4" fill="#14191B"/>
  <line x1="1010" y1="845" x2="1010" y2="856" stroke="#14191B" stroke-width="2"/>
