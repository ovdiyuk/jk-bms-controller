<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1540 1290" width="1540" height="1290"
     font-family="Segoe UI, Helvetica, Arial, sans-serif"
     role="img" aria-label="Принципова схема пульта керування JK BMS через оптичний канал">
  <title>Пульт керування JK BMS — принципова схема</title>
  <desc>Пульт: USB-C на модуль заряду, Li-Po 3.7 V, вимикач, два підвищувачі 5 V і 12 V.
ESP32-C3 через GPIO4/GPIO3 обмінюється з оптомодулем, перемикач РЕБ з 3V3 на GPIO1,
триколірний індикатор зі спільним катодом на GPIO5/6/7. Одне волокно перетинає межу
гальванічної розв'язки і входить у дальній оптомодуль, зв'язаний з роз'ємом GPS на JK BMS.</desc>

  <defs>
    <marker id="aTx" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1C5F90"/>
    </marker>
    <marker id="aRx" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1B7860"/>
    </marker>
    <marker id="aPw" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A4FA8"/>
    </marker>
  </defs>

  <rect width="1540" height="1290" fill="#FFFFFF"/>

  <!-- ===================== ПУЛЬТ ===================== -->
  <text x="30" y="30" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" letter-spacing="1.8" fill="#6B7C83">ПУЛЬТ</text>

  <!-- USB-C -->
  <rect x="30" y="70" width="74" height="46" rx="4" fill="#FFFFFF" stroke="#14191B" stroke-width="1.6"/>
  <text x="67" y="99" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#14191B">USB-C</text>
  <line x1="104" y1="93" x2="150" y2="93" stroke="#7A4FA8" stroke-width="2"/>

  <!-- charge module -->
  <rect x="150" y="61" width="164" height="64" rx="4" fill="#FFFFFF" stroke="#14191B" stroke-width="1.6"/>
  <text x="232" y="88" text-anchor="middle" font-size="16" font-weight="700" fill="#14191B">Заряд + захист</text>
  <text x="232" y="109" text-anchor="middle" font-size="13" fill="#6B7C83">від переразряду</text>
  <line x1="314" y1="93" x2="455" y2="93" stroke="#7A4FA8" stroke-width="2"/>

  <!-- battery -->
  <circle cx="390" cy="93" r="4.2" fill="#7A4FA8"/>
  <line x1="390" y1="93" x2="390" y2="136" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="364" y1="140" x2="416" y2="140" stroke="#7A4FA8" stroke-width="2.6"/>
  <line x1="376" y1="152" x2="404" y2="152" stroke="#7A4FA8" stroke-width="2.6"/>
  <line x1="364" y1="164" x2="416" y2="164" stroke="#7A4FA8" stroke-width="2.6"/>
  <line x1="376" y1="176" x2="404" y2="176" stroke="#7A4FA8" stroke-width="2.6"/>
  <text x="424" y="146" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" fill="#7A4FA8">+</text>
  <line x1="390" y1="176" x2="390" y2="206" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="367" y1="206" x2="413" y2="206" stroke="#14191B" stroke-width="2.4"/>
  <line x1="376" y1="215" x2="404" y2="215" stroke="#14191B" stroke-width="2.4"/>
  <line x1="384" y1="224" x2="396" y2="224" stroke="#14191B" stroke-width="2.4"/>
  <text x="390" y="252" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#14191B">Li-Po 3.7 V</text>
  <text x="390" y="271" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="14" fill="#6B7C83">2000 mAh</text>

  <!-- main switch -->
  <circle cx="459" cy="93" r="4.5" fill="#FFFFFF" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="462" y1="90" x2="502" y2="68" stroke="#7A4FA8" stroke-width="2" stroke-linecap="round"/>
  <circle cx="506" cy="93" r="4.5" fill="#FFFFFF" stroke="#7A4FA8" stroke-width="2"/>
  <text x="483" y="44" text-anchor="middle" font-size="14" fill="#7A4FA8">вимикач пульта</text>
  <line x1="510" y1="93" x2="575" y2="93" stroke="#7A4FA8" stroke-width="2"/>

  <!-- split -->
  <circle cx="575" cy="93" r="4.2" fill="#7A4FA8"/>
  <line x1="575" y1="72" x2="575" y2="192" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="575" y1="72" x2="640" y2="72" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="575" y1="192" x2="640" y2="192" stroke="#7A4FA8" stroke-width="2"/>

  <!-- DC-DC 12 V -->
  <rect x="640" y="40" width="172" height="64" rx="4" fill="#FFFFFF" stroke="#14191B" stroke-width="1.6"/>
  <text x="726" y="68" text-anchor="middle" font-size="15" font-weight="700" fill="#14191B">DC-DC BS02 V4</text>
  <text x="726" y="90" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#7A4FA8">12 V</text>

  <!-- DC-DC 5 V -->
  <rect x="640" y="160" width="172" height="64" rx="4" fill="#FFFFFF" stroke="#14191B" stroke-width="1.6"/>
  <text x="726" y="188" text-anchor="middle" font-size="15" font-weight="700" fill="#14191B">DC-DC BS02 V4</text>
  <text x="726" y="210" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#7A4FA8">5 V</text>

  <!-- +12 V run -->
  <line x1="812" y1="72" x2="1300" y2="72" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="1300" y1="72" x2="1300" y2="300" stroke="#7A4FA8" stroke-width="2"/>
  <text x="1060" y="60" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#7A4FA8">+12 V</text>

  <!-- +5 V run -->
  <line x1="812" y1="192" x2="845" y2="192" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="845" y1="192" x2="845" y2="380" stroke="#7A4FA8" stroke-width="2"/>
  <line x1="845" y1="380" x2="880" y2="380" stroke="#7A4FA8" stroke-width="2"/>
