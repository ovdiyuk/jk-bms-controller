  <text x="250" y="1065" font-size="14" fill="#3B4A50">працює — заряд понад 20 %</text>

  <circle cx="68" cy="1098" r="9" fill="#FFFFFF" stroke="#2FA360" stroke-width="2.6" stroke-dasharray="4 3"/>
  <text x="94" y="1103" font-size="14" font-weight="700" fill="#14191B">зелений мигає</text>
  <text x="250" y="1103" font-size="14" fill="#3B4A50">працює — заряд 20 % і нижче</text>

  <circle cx="68" cy="1136" r="9" fill="#D14026" stroke="#A03A1E" stroke-width="1.4"/>
  <text x="94" y="1141" font-size="14" font-weight="700" fill="#14191B">червоний рівно</text>
  <text x="250" y="1141" font-size="14" fill="#3B4A50">працює з аваріями — розряд увімкнений</text>

  <circle cx="68" cy="1174" r="9" fill="#FFFFFF" stroke="#D14026" stroke-width="2.6" stroke-dasharray="4 3"/>
  <text x="94" y="1179" font-size="14" font-weight="700" fill="#14191B">червоний мигає</text>
  <text x="250" y="1179" font-size="14" fill="#3B4A50">зупинено з аваріями — розряд вимкнений</text>

  <circle cx="56" cy="1212" r="7" fill="#FFFFFF" stroke="#D14026" stroke-width="2.2" stroke-dasharray="3 2.5"/>
  <circle cx="74" cy="1212" r="7" fill="#FFFFFF" stroke="#D9A81C" stroke-width="2.2" stroke-dasharray="3 2.5"/>
  <circle cx="92" cy="1212" r="7" fill="#FFFFFF" stroke="#2FA360" stroke-width="2.2" stroke-dasharray="3 2.5"/>
  <text x="112" y="1217" font-size="14" font-weight="700" fill="#14191B">усі три, 300 мс</text>
  <text x="250" y="1217" font-size="14" fill="#3B4A50">немає зв’язку з BMS понад 5 с — пріоритет над усім</text>

  <text x="52" y="1243" font-size="12.5" fill="#6B7C83">Стан береться з фактичного положення ключа, що повідомляє BMS, а не з положення перемикача.</text>

