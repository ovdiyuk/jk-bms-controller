  <text x="1010" y="618" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#B8900F">GPIO6</text>
  <text x="1120" y="618" text-anchor="middle" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#2FA360">GPIO7</text>
  <text x="1005" y="563" text-anchor="middle" font-size="13" fill="#6B7C83">Serial1 · 115200 8N1</text>

  <!-- ESP32 ground (battery return) -->
  <line x1="880" y1="580" x2="830" y2="580" stroke="#14191B" stroke-width="2"/>
  <line x1="830" y1="580" x2="830" y2="606" stroke="#14191B" stroke-width="2"/>
